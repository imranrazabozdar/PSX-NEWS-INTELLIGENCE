# Investify announcements into psx-library, under the written consent (docs/consent/investify-2026-11-12.md).
#
# * Manual dispatch only: nothing polls Investify on a timer. A run makes AT MOST ONE request; the good-citizen
#   gate in code decides whether any request is allowed (collector switched on in config/investify_good_citizen.json,
#   trading window, quiet window 10:00-15:30 PKT, 15-minute floor, daily/weekly ceilings, 24-hour cache-first TTL,
#   robots.txt, backoff, circuit breaker). Outside the window the run ends without a request.
# * Kill switch: repository variable PSXNI_KILL_SWITCH = "true".
# * It never touches the older news database. Polling state and the audit trail are kept between runs by the cache.
# * `apply` false = one request, parse and print, nothing written to psx-library.
name: Investify announcements to library

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the facts to psx-library (false = one request, nothing stored)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: investify-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PSXNI_KILL_SWITCH: ${{ vars.PSXNI_KILL_SWITCH }}
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
      PSXNI_DB_MAX_ROWS_READ: "100000"
      PSXNI_DB_MAX_ROWS_WRITTEN: "3000"
      PSXNI_DB_MAX_REQUESTS: "200"
      STATE_DIR: /tmp/investify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore polling state and audit trail
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_DIR }}
          key: investify-state-${{ github.run_id }}
          restore-keys: |
            investify-state-
      - name: One consented request, parsed into facts
        run: python -m collectors.investify_library_job --state "$STATE_DIR/state.json" --out investify_facts.json
      - name: Load the facts (only when apply)
        if: ${{ inputs.apply }}
        run: |
          if [ -f investify_facts.json ]; then
            python -m scripts.absorb_sector_capsule investify_facts.json --since-days 60 --apply
          else
            echo "no facts this run (no new page, outside the window, or a backoff): nothing to load"
          fi
      - name: Save polling state and audit trail
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_DIR }}
          key: investify-state-${{ github.run_id }}
      - name: Keep the compliance audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investify-audit-${{ github.run_id }}
          path: ${{ env.STATE_DIR }}/investify_audit.jsonl
          retention-days: 90
          if-no-files-found: ignore
