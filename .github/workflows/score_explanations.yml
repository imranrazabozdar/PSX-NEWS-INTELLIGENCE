# Explanation scoring (engines/explanation_scoring.py): do the move explanations tell us anything? Read only: no database is written.
name: Explanation scoring

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
      PSXNI_DB_MAX_ROWS_READ: "400000"
      PSXNI_DB_MAX_ROWS_WRITTEN: "1"
      PSXNI_DB_MAX_REQUESTS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score the explanations
        run: python -m scripts.score_explanations
      - uses: actions/upload-artifact@v4
        with:
          name: explanation-scoring
          path: .scoring
          include-hidden-files: true
          retention-days: 30
