# Read-only: print where chosen symbols stand in the dashboard's setups rankings, with the evidence.
name: Setups check

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols, for example MARI,HUBC"
        required: true
        default: "MARI,HUBC"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.setups_check --symbols "${{ inputs.symbols }}"
