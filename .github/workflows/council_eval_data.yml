# Read-only data for the council's seven-day dry-run evaluation. Changes nothing; no model, no paid API.
name: Council evaluation data

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        required: true
        default: "7"

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.council_eval_data --days "${{ inputs.days }}" --out council_eval_data.json
      - uses: actions/upload-artifact@v4
        with:
          name: council-eval-data
          path: council_eval_data.json
          retention-days: 14
