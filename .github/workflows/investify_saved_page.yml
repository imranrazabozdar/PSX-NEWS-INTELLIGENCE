# Load announcements from an Investify page that an earlier dry run ALREADY fetched and saved (the artifact
# investify-page-<run id>, kept 3 days). This workflow makes NO request to Investify: it reads the saved file.
# Exact repeats of facts already in the library are skipped. `apply` false = count only.
name: Investify saved page to library

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the dry run that saved the page (artifact investify-page-<run_id>)"
        required: true
      saved_at:
        description: "When that page was fetched, ISO UTC (the audit trail's ts_utc), e.g. 2026-11-18T05:51:05Z"
        required: true
      apply:
        description: "Write to psx-library (false = count only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
      PSXNI_DB_MAX_ROWS_READ: "100000"
      PSXNI_DB_MAX_ROWS_WRITTEN: "3000"
      PSXNI_DB_MAX_REQUESTS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the saved page
        run: gh run download "${{ inputs.run_id }}" -n "investify-page-${{ inputs.run_id }}" -D saved
      - name: Build facts from the saved page
        run: python -m scripts.investify_page_to_facts --page saved/investify_page.html --out saved_facts.json --saved-at "${{ inputs.saved_at }}"
      - name: Load the facts (only when apply)
        if: ${{ inputs.apply }}
        run: |
          if [ -f saved_facts.json ]; then
            python -m scripts.absorb_sector_capsule saved_facts.json --since-days 60 --apply
          fi
