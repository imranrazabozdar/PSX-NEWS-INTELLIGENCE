# Private forward tracking of the live setups rankings (out of sample). Weekdays after the technical engine has
# updated that day's prices (about 16:30 PKT). Read only on the library; the snapshots are a private file carried
# between runs by the Actions cache and kept as an artifact. Nothing is written to psx-library.
name: Setups forward tracking

on:
  schedule:
    - cron: "41 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write  # only to push the results file to the dedicated data branch

concurrency:
  group: setups-forward
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the snapshots
        uses: actions/cache/restore@v4
        with:
          path: .setups_forward
          key: setups-forward-none
          restore-keys: setups-forward-
      - run: python -m scripts.setups_forward
      - name: Publish the results file to the data branch (results.json and snapshots only)
        if: success()
        env:
          BRANCH: data/setups-forward
        run: |
          set -e
          git fetch --quiet origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            git worktree add --quiet databranch -B "$BRANCH" "origin/$BRANCH"
          else
            git worktree add --quiet --orphan -b "$BRANCH" databranch
          fi
          cp .setups_forward/results.json .setups_forward/snapshots.jsonl databranch/
          cd databranch
          git config user.name "psxni-data-bot"
          git config user.email "psxni-data-bot@users.noreply.github.com"
          git add results.json snapshots.jsonl
          if git diff --cached --quiet; then echo "no change to publish"; else
            git commit --quiet -m "setups forward tracking: results $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet origin "$BRANCH"
          fi
      - name: Save the snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .setups_forward
          key: setups-forward-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setups-forward-${{ github.run_id }}
          path: .setups_forward
          retention-days: 90
          if-no-files-found: ignore
          include-hidden-files: true
