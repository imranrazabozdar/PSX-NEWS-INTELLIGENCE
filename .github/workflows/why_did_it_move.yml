# Why did it move (engines/move_explainer.py): candidate explanations for notable price moves. Read only: no database is written.
name: Why did it move

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Sessions to look back"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PSXNI_LIBRARY_TURSO_DATABASE_URL: ${{ secrets.PSXNI_LIBRARY_TURSO_DATABASE_URL }}
      PSXNI_LIBRARY_TURSO_AUTH_TOKEN: ${{ secrets.PSXNI_LIBRARY_TURSO_AUTH_TOKEN }}
      PSXNI_DB_MAX_ROWS_READ: "150000"
      PSXNI_DB_MAX_ROWS_WRITTEN: "1"
      PSXNI_DB_MAX_REQUESTS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Explain the moves
        run: python -m scripts.explain_moves --days "${{ inputs.days }}"
      - uses: actions/upload-artifact@v4
        with:
          name: why-did-it-move
          path: .moves
          include-hidden-files: true
          retention-days: 30
