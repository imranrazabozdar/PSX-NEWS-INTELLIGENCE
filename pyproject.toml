[project]
name = "psx-news-intelligence"
version = "0.0.1"
description = "Independent PSX Fundamental & News Intelligence Engine (research terminal, no auto-trading)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved" }
dependencies = [
    "streamlit>=1.40,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
